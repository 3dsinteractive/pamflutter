group = "ai.pams.pam_flutter"
version = "3.2.4"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
// AGP 9 enables built-in Kotlin by default. Older hosts still need KGP.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlin = agpMajor >= 9 &&
    project.findProperty("android.builtInKotlin")?.toString() != "false"
if (!builtInKotlin) {
    apply plugin: "kotlin-android"
}

if (builtInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

android {
    namespace = "ai.pams.pam_flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    if (!builtInKotlin) {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        implementation 'com.github.bumptech.glide:glide:4.16.0'
        
        testImplementation("org.jetbrains.kotlin:kotlin-test-junit5:1.8.22")
        testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.11.4")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.4")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
